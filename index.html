<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>安全第一：低音事故防止チェッカー (KickYoshi)</title>
    <style>
        body {
            background-color: #1e221a;
            color: #e0e8d5;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .safety-bar {
            width: 100%;
            height: 15px;
            background: repeating-linear-gradient(45deg, #ffcc00, #ffcc00 10px, #111 10px, #111 20px);
            margin-bottom: 20px;
        }
        h1 { color: #00ff66; margin-bottom: 5px; font-size: 26px; font-weight: bold; }
        .genba-sign {
            background: #fff;
            color: #111;
            padding: 5px 15px;
            font-weight: bold;
            border: 3px solid #006633;
            border-radius: 3px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        #drop-zone {
            width: 600px;
            height: 100px;
            border: 3px dashed #ffcc00;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #252a20;
            cursor: pointer;
            font-weight: bold;
            color: #ffcc00;
            transition: 0.3s;
            margin-bottom: 20px;
        }
        #drop-zone.hover { background: #353f2d; border-color: #fff; color: #fff; }
        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 800px;
            background: #252a20;
            padding: 20px;
            border-radius: 5px;
            border: 2px solid #006633;
        }
        .view-title { font-weight: bold; color: #ffcc00; margin-bottom: 5px; border-left: 5px solid #00ff66; padding-left: 8px; }
        canvas {
            background: #050803;
            border: 1px solid #006633;
            width: 100%;
            height: 180px;
            display: block;
        }
        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            background: #1e221a;
            padding: 10px;
            border-radius: 3px;
            align-items: center;
        }
        button {
            background: #00ff66;
            color: #000;
            border: none;
            padding: 8px 15px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #00cc55; }
        .info-box {
            background: #111;
            padding: 15px;
            border: 2px solid #ff3333;
            font-size: 13px;
            line-height: 1.7;
        }
    </style>
</head>
<body>

    <div class="safety-bar"></div>
    <h1>🟢 安全第一：低音事故防止チェッカー</h1>
    <div class="genba-sign">⚠️ 危険：30Hz以下の居眠り・位相のねじれに注意せよ！</div>

    <div id="drop-zone">【ここにWAVをドロップ】 音響安全確認を行う </div>

    <div class="container" id="analyzer-container" style="display:none;">
        <div class="controls">
            <button id="play-btn">再生確認</button>
            <label><input type="checkbox" id="mono-chk"> 🟢 強制モノラル（クラブ音響シミュレート）</label>
        </div>

        <div>
            <div class="view-title">指差呼称 ①：スペクトログラム（低音の残響監視の現場）</div>
            <canvas id="spectrogram"></canvas>
        </div>

        <div>
            <div class="view-title">指差呼称 ②：スペクトラム（過大入力の検知）</div>
            <canvas id="spectrum"></canvas>
        </div>

        <div class="info-box">
            <strong>👷‍♂️ 現場の安全チェックリスト：</strong><br>
            1. <strong>滝の隙間ヨシ！：</strong>キックが鳴り止んだ後、次のアタックまでの間に一番下のエリアが暗くなっていますか？真っ赤なままだと低音泥沼災害が発生します。<br>
            2. <strong>モノラル位相ヨシ！：</strong>「強制モノラル」を入れた瞬間、低音がスカスカになる場合はリバーブの広げすぎによる【位相崩壊事故】の現行犯です。
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const container = document.getElementById('analyzer-container');
        const playBtn = document.getElementById('play-btn');
        const monoChk = document.getElementById('mono-chk');
        
        let audioCtx, audioBuffer, sourceNode, gainNode;
        let analyser, dataArray, bufferLength;
        let isPlaying = false;
        
        const canvasSpec = document.getElementById('spectrum');
        const ctxSpec = canvasSpec.getContext('2d');
        const canvasSg = document.getElementById('spectrogram');
        const ctxSg = canvasSg.getContext('2d');
        
        let tempCanvas = document.createElement('canvas');
        let tempCtx = tempCanvas.getContext('2d');

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('hover'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('hover'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('hover');
            const files = e.dataTransfer.files;
            if (files.length > 0 && files[0].type.match('audio.*')) {
                initAudio(files[0]);
            }
        });

        async function initAudio(file) {
            if (isPlaying) stopAudio();
            
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const arrayBuffer = await file.arrayBuffer();
            audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
            
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 2048;
            bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);
            
            // コンテナをまず表示させて、DOM上の横幅を確定させる（サイズ0防止）
            container.style.display = 'block';
            
            // 確定した横幅を取得（取得できない場合はデフォルト800）
            const w = canvasSpec.parentElement.clientWidth || 800;
            const h = 180;
            
            canvasSpec.width = w;
            canvasSpec.height = h;
            canvasSg.width = w;
            canvasSg.height = h;
            tempCanvas.width = w;
            tempCanvas.height = h;

            dropZone.innerText = `安全確認対象: ${file.name}`;
            
            // 最初の一回だけ背景を黒で塗りつぶす（エラー防止）
            ctxSg.fillStyle = '#050803';
            ctxSg.fillRect(0, 0, w, h);
            tempCtx.fillStyle = '#050803';
            tempCtx.fillRect(0, 0, w, h);
        }

        function playAudio() {
            if (!audioBuffer) return;
            
            sourceNode = audioCtx.createBufferSource();
            sourceNode.buffer = audioBuffer;
            sourceNode.loop = true;
            
            gainNode = audioCtx.createGain();
            
            if (monoChk.checked) {
                gainNode.channelCount = 1;
                gainNode.channelCountMode = "explicit";
            } else {
                gainNode.channelCount = 2;
                gainNode.channelCountMode = "max";
            }
            
            sourceNode.connect(analyser);
            analyser.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            sourceNode.start(0);
            isPlaying = true;
            playBtn.innerText = "確認停止";
            
            // 再生が始まったら描画ループを回す
            draw();
        }

        function stopAudio() {
            if (sourceNode) {
                sourceNode.stop();
                sourceNode.disconnect();
            }
            isPlaying = false;
            playBtn.innerText = "再生確認";
        }

        playBtn.addEventListener('click', () => {
            if (isPlaying) stopAudio(); else playAudio();
        });

        monoChk.addEventListener('change', () => {
            if (isPlaying) {
                stopAudio();
                playAudio();
            }
        });

        function draw() {
            if (!isPlaying || !analyser) return;
            requestAnimationFrame(draw);

            // キャンバスサイズが正常か再チェック（安全対策）
            if (canvasSg.width === 0 || canvasSg.height === 0) return;

            // ① スペクトラム（周波数）の描画
            analyser.getByteFrequencyData(dataArray);
            ctxSpec.fillStyle = '#050803';
            ctxSpec.fillRect(0, 0, canvasSpec.width, canvasSpec.height);
            
            let barWidth = (canvasSpec.width / bufferLength) * 2.5;
            let barHeight;
            let x = 0;

            for(let i = 0; i < bufferLength; i++) {
                barHeight = dataArray[i];
                ctxSpec.fillStyle = `rgb(${barHeight+30}, ${barHeight*0.8}, 30)`;
                ctxSpec.fillRect(x, canvasSpec.height - barHeight/1.5, barWidth, barHeight/1.5);
                x += barWidth + 1;
            }
            
            ctxSpec.fillStyle = '#888';
            ctxSpec.font = '11px sans-serif';
            ctxSpec.fillText('← 低音域 (30Hz-100Hz)', 10, 20);
            ctxSpec.fillText('中高音域 →', canvasSpec.width - 80, 20);

            // ② スペクトログラム（滝）の描画（サイズ0チェック通過後なので安全）
            tempCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
            tempCtx.drawImage(canvasSg, 0, 0);
            
            ctxSg.clearRect(0, 0, canvasSg.width, canvasSg.height);
            ctxSg.drawImage(tempCanvas, -1, 0);

            for (let i = 0; i < canvasSg.height; i++) {
                let logIndex = Math.floor(Math.pow(i / canvasSg.height, 2) * (bufferLength / 4));
                let value = dataArray[logIndex] || 0;
                
                // 現場カラー（緑から黄色、危険な低音過多は赤へ）
                let r = value > 140 ? value : 0;
                let g = value > 50 ? value : 30;
                let b = value < 80 ? value : 0;
                
                ctxSg.fillStyle = `rgb(${r},${g},${b})`;
                ctxSg.fillRect(canvasSg.width - 1, canvasSg.height - i, 1, 1);
            }
        }
    </script>
</body>
</html>
